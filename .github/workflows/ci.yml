name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: |
          find . -type f -name '*.sh' -print0 | while IFS= read -r -d '' f; do bash -n "$f"; done
